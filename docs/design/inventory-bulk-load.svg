<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Top nav -->
  <rect x="0" y="0" width="1200" height="64" fill="#0b1220"/>
  <circle cx="40" cy="32" r="14" fill="url(#brand)"/>
  <text x="66" y="39" fill="#e5e7eb" font-size="20" font-weight="700">OctoCAT Supply</text>
  <text x="1000" y="39" fill="#9ca3af" font-size="15">Admin · Inventory</text>

  <!-- Page card -->
  <rect x="120" y="112" width="960" height="600" rx="16" fill="#1e293b" filter="url(#shadow)"/>

  <!-- Page title -->
  <text x="160" y="168" fill="#f8fafc" font-size="30" font-weight="700">Inventory Bulk Load</text>
  <text x="160" y="198" fill="#94a3b8" font-size="15">Paste a comma-delimited list of products to add them to inventory in one step.</text>

  <!-- Textarea label -->
  <text x="160" y="248" fill="#cbd5e1" font-size="14" font-weight="600">PRODUCTS (comma-delimited)</text>

  <!-- Large paste textarea -->
  <rect x="160" y="262" width="880" height="240" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="180" y="292" fill="#64748b" font-size="14" font-family="ui-monospace, Menlo, monospace">Smart Feeder Pro, Interactive Laser Toy, Cozy Heated Bed,</text>
  <text x="180" y="316" fill="#64748b" font-size="14" font-family="ui-monospace, Menlo, monospace">GPS Collar, Auto Litter Box, Wellness Monitor</text>

  <!-- Bulk Load button -->
  <rect x="160" y="528" width="200" height="52" rx="10" fill="url(#brand)"/>
  <text x="260" y="561" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Bulk Load</text>

  <!-- Secondary clear -->
  <rect x="376" y="528" width="120" height="52" rx="10" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="436" y="561" fill="#cbd5e1" font-size="15" text-anchor="middle">Clear</text>

  <!-- Results / summary area -->
  <text x="160" y="628" fill="#cbd5e1" font-size="14" font-weight="600">RESULTS</text>
  <rect x="160" y="642" width="880" height="52" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <circle cx="188" cy="668" r="6" fill="#22c55e"/>
  <text x="206" y="673" fill="#e5e7eb" font-size="14">6 added</text>
  <circle cx="320" cy="668" r="6" fill="#f59e0b"/>
  <text x="338" y="673" fill="#e5e7eb" font-size="14">1 skipped (duplicate)</text>
  <circle cx="560" cy="668" r="6" fill="#ef4444"/>
  <text x="578" y="673" fill="#e5e7eb" font-size="14">0 errors</text>
</svg>
